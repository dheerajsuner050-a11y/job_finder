<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — PLUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="scan-line"></div>
    <a href="index.html" class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">PLUTO</div>
    </a>
    <div class="auth-visual-copy">
      <h2>Welcome back.</h2>
      <p>Log in to pick up where you left off — your last ATS score, extracted skills, and matched jobs are all waiting on your dashboard.</p>
    </div>
    <div></div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <h1>Log in</h1>
      <p class="sub">Enter your details to access your dashboard.</p>

      <div class="form-error-banner" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div style="text-align:right; margin-bottom:18px;">
          <a href="forgot-password.html" style="font-size:13px;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <div class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
