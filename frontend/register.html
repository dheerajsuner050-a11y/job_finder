<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — PLUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="scan-line"></div>
    <a href="index.html" class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">PLUTO</div>
    </a>
    <div class="auth-visual-copy">
      <h2>Create your account.</h2>
      <p>Upload a resume, get an instant ATS score, and see live job matches — free to start.</p>
    </div>
    <div></div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <h1>Sign up</h1>
      <p class="sub">Create an account to save your resume analysis.</p>

      <div class="form-error-banner" id="registerError"></div>

      <form id="registerForm">
        <div class="field">
          <label for="regName">Full name</label>
          <input type="text" id="regName" placeholder="Jane Doe" required />
        </div>
        <div class="field">
          <label for="regEmail">Email address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
