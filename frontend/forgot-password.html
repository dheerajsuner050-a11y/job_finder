<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — PLUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="scan-line"></div>
    <a href="index.html" class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">PLUTO</div>
    </a>
    <div class="auth-visual-copy">
      <h2>Forgot your password?</h2>
      <p>No problem — enter your email and we'll help you get back in.</p>
    </div>
    <div></div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <h1>Reset password</h1>
      <p class="sub">We'll send a reset link to your registered email.</p>

      <div class="form-error-banner" id="forgotError"></div>
      <div class="form-success-banner" id="forgotSuccess"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="forgotEmail">Email address</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>

      <div class="auth-switch">Remembered it? <a href="login.html">Back to login</a></div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
