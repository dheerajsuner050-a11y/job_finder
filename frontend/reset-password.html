<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — PLUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="scan-line"></div>
    <a href="index.html" class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">PLUTO</div>
    </a>
    <div class="auth-visual-copy">
      <h2>Set your new password.</h2>
      <p>Enter your new password below to secure your PLUTO account.</p>
    </div>
    <div></div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <h1>New Password</h1>
      <p class="sub">Please choose a strong password with at least 6 characters.</p>

      <div class="form-error-banner" id="resetError"></div>
      <div class="form-success-banner" id="resetSuccess"></div>

      <form id="resetPasswordForm">
        <input type="hidden" id="resetToken" />
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="At least 6 characters" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </form>

      <div class="auth-switch"><a href="login.html">Back to login</a></div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
