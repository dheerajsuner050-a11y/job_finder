<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jobs — PLUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="index.html" class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">PLUTO</div>
    </a>
    <a href="dashboard.html" class="side-link">Dashboard</a>
    <a href="upload-resume.html" class="side-link">Upload Resume</a>
    <a href="ats-result.html" class="side-link">ATS Result</a>
    <a href="jobs.html" class="side-link active">Jobs</a>
    <a href="profile.html" class="side-link">Profile</a>
    <div class="sidebar-footer">
      <a href="#" class="side-link" data-logout>Log out</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <h1>Matching jobs</h1>
      <div class="user-chip" id="userChip"></div>
    </div>

    <div class="jobs-toolbar">
      <input type="text" id="jobSearchInput" placeholder="Filter by title, company, or location…" />
    </div>

    <div class="empty-state card" id="jobsEmptyState" style="display:none;">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 7h-3V5a2 2 0 00-2-2H9a2 2 0 00-2 2v2H4a1 1 0 00-1 1v11a1 1 0 001 1h16a1 1 0 001-1V8a1 1 0 00-1-1zM9 5h6v2H9V5z"/></svg>
      <h3>No jobs to show yet</h3>
      <p>Analyze a resume first — matching jobs are pulled based on the skills PLUTO finds.</p>
      <a href="upload-resume.html" class="btn btn-primary" style="margin-top:14px;">Analyze Resume</a>
    </div>

    <div class="job-grid" id="jobsList"></div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/jobs.js"></script>
</body>
</html>
