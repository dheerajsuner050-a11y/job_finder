<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analyze Resume — PLUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="index.html" class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-name">PLUTO</div>
    </a>
    <a href="dashboard.html" class="side-link">Dashboard</a>
    <a href="upload-resume.html" class="side-link active">Upload Resume</a>
    <a href="ats-result.html" class="side-link">ATS Result</a>
    <a href="jobs.html" class="side-link">Jobs</a>
    <a href="profile.html" class="side-link">Profile</a>
    <div class="sidebar-footer">
      <a href="#" class="side-link" data-logout>Log out</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <h1>Analyze your resume</h1>
      <div class="user-chip" id="userChip"></div>
    </div>

    <div class="upload-wrap">
      <div class="card">
        <label class="field-label" style="display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;">Attach resume (PDF only)</label>

        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload PDF resume">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <p style="margin:0; font-size:14px; color:var(--ink-soft);">Click to browse, or drop a PDF here</p>
          <div class="fname" id="fname"></div>
        </div>
        <input type="file" id="fileInput" accept="application/pdf" />

        <button type="button" class="optional-toggle" id="optToggle">+ add target job details (optional)</button>
        <div class="optional-fields" id="optFields">
          <div class="field" style="margin-bottom:0;">
            <label for="targetSkills">Target skills (comma-separated)</label>
            <input type="text" id="targetSkills" placeholder="python, django, aws" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="location">Preferred location</label>
            <input type="text" id="location" placeholder="Bhopal" />
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="submitBtn" style="margin-top:20px;">Analyze Resume</button>

        <div class="form-error-banner" id="uploadError"></div>

        <div class="loading-row" id="loadingRow" style="display:none;">
          <span class="dotpulse"><i></i><i></i><i></i></span>
          <span>Analyzing resume…</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/resume.js"></script>
</body>
</html>
